<svg xmlns="http://www.w3.org/2000/svg" width="80" height="160" viewBox="0 0 80 160">
  <!-- Feet/paws -->
  <ellipse cx="22" cy="155" rx="12" ry="7" fill="#c8882a"/>
  <ellipse cx="58" cy="155" rx="12" ry="7" fill="#c8882a"/>
  <!-- Toe lines -->
  <g stroke="#a06010" stroke-width="1" stroke-linecap="round">
    <line x1="16" y1="158" x2="16" y2="153"/><line x1="22" y1="159" x2="22" y2="154"/>
    <line x1="28" y1="158" x2="28" y2="153"/>
    <line x1="52" y1="158" x2="52" y2="153"/><line x1="58" y1="159" x2="58" y2="154"/>
    <line x1="64" y1="158" x2="64" y2="153"/>
  </g>
  <!-- Legs -->
  <rect x="14" y="110" width="16" height="45" rx="8" fill="#d4922e"/>
  <rect x="50" y="110" width="16" height="45" rx="8" fill="#d4922e"/>
  <!-- Body -->
  <ellipse cx="40" cy="100" rx="26" ry="32" fill="#d4922e"/>
  <!-- Belly -->
  <ellipse cx="40" cy="105" rx="16" ry="20" fill="#e8b85a" opacity="0.7"/>
  <!-- Arms -->
  <rect x="10" y="78" width="14" height="36" rx="7" fill="#d4922e" transform="rotate(-15 17 96)"/>
  <rect x="56" y="78" width="14" height="36" rx="7" fill="#d4922e" transform="rotate(15 63 96)"/>
  <!-- Mane outer -->
  <ellipse cx="40" cy="42" rx="32" ry="30" fill="#8b4500"/>
  <!-- Mane inner -->
  <ellipse cx="40" cy="44" rx="26" ry="25" fill="#b05e10"/>
  <!-- Head -->
  <ellipse cx="40" cy="40" rx="20" ry="22" fill="#e8a840"/>
  <!-- Ears -->
  <ellipse cx="22" cy="22" rx="7" ry="8" fill="#b05e10"/>
  <ellipse cx="22" cy="22" rx="4" ry="5" fill="#e8a840"/>
  <ellipse cx="58" cy="22" rx="7" ry="8" fill="#b05e10"/>
  <ellipse cx="58" cy="22" rx="4" ry="5" fill="#e8a840"/>
  <!-- Eyes -->
  <ellipse cx="33" cy="38" rx="5" ry="5" fill="#553300"/>
  <ellipse cx="47" cy="38" rx="5" ry="5" fill="#553300"/>
  <circle cx="33" cy="38" r="3" fill="#221100"/>
  <circle cx="47" cy="38" r="3" fill="#221100"/>
  <circle cx="34" cy="37" r="1.2" fill="white"/>
  <circle cx="48" cy="37" r="1.2" fill="white"/>
  <!-- Eyebrows -->
  <path d="M29,32 Q33,29 37,32" stroke="#8b4500" stroke-width="2" fill="none"/>
  <path d="M43,32 Q47,29 51,32" stroke="#8b4500" stroke-width="2" fill="none"/>
  <!-- Nose -->
  <ellipse cx="40" cy="45" rx="6" ry="4" fill="#cc5522"/>
  <circle cx="37" cy="46" r="1.5" fill="#992200"/>
  <circle cx="43" cy="46" r="1.5" fill="#992200"/>
  <!-- Mouth -->
  <path d="M34,50 Q40,56 46,50" stroke="#992200" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Whisker dots -->
  <g fill="#cc8830">
    <circle cx="28" cy="48" r="1.5"/><circle cx="24" cy="46" r="1.5"/><circle cx="20" cy="44" r="1.5"/>
    <circle cx="52" cy="48" r="1.5"/><circle cx="56" cy="46" r="1.5"/><circle cx="60" cy="44" r="1.5"/>
  </g>
  <!-- Tail -->
  <path d="M64,120 Q85,100 78,80 Q72,65 80,55" stroke="#d4922e" stroke-width="5" fill="none" stroke-linecap="round"/>
  <ellipse cx="81" cy="52" rx="6" ry="8" fill="#8b4500" transform="rotate(20 81 52)"/>
</svg>
