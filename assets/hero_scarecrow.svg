<svg xmlns="http://www.w3.org/2000/svg" width="80" height="160" viewBox="0 0 80 160">
  <!-- Shoes (floppy) -->
  <ellipse cx="26" cy="156" rx="13" ry="6" fill="#553322" transform="rotate(-8 26 156)"/>
  <ellipse cx="54" cy="156" rx="13" ry="6" fill="#553322" transform="rotate(8 54 156)"/>
  <!-- Legs (patched trousers) -->
  <rect x="19" y="108" width="16" height="48" rx="5" fill="#7a6030"/>
  <rect x="45" y="108" width="16" height="48" rx="5" fill="#7a6030"/>
  <!-- Patches -->
  <rect x="21" y="125" width="9" height="7" rx="2" fill="#5a4515" transform="rotate(-5 25 128)"/>
  <rect x="47" y="138" width="8" height="7" rx="2" fill="#5a4515" transform="rotate(5 51 141)"/>
  <!-- Straw from legs -->
  <g stroke="#ddbb44" stroke-width="1.5" stroke-linecap="round" opacity="0.9">
    <line x1="22" y1="152" x2="20" y2="160"/><line x1="27" y1="153" x2="25" y2="161"/>
    <line x1="32" y1="153" x2="34" y2="161"/>
    <line x1="48" y1="153" x2="46" y2="161"/><line x1="53" y1="153" x2="51" y2="161"/>
    <line x1="58" y1="152" x2="60" y2="160"/>
  </g>
  <!-- Body coat -->
  <rect x="20" y="68" width="40" height="45" rx="8" fill="#8b7040"/>
  <!-- Coat patches -->
  <rect x="22" y="78" width="10" height="8" rx="2" fill="#6a5025" transform="rotate(5 27 82)"/>
  <rect x="50" y="85" width="9" height="7" rx="2" fill="#aa8844" transform="rotate(-4 54 88)"/>
  <rect x="36" y="98" width="10" height="7" rx="2" fill="#6a5025" transform="rotate(3 41 101)"/>
  <!-- Straw from sides -->
  <g stroke="#ddbb44" stroke-width="1.5" stroke-linecap="round" opacity="0.9">
    <line x1="20" y1="80" x2="10" y2="76"/><line x1="20" y1="87" x2="9" y2="85"/>
    <line x1="20" y1="94" x2="10" y2="94"/>
    <line x1="60" y1="80" x2="70" y2="76"/><line x1="60" y1="87" x2="71" y2="85"/>
    <line x1="60" y1="94" x2="70" y2="94"/>
  </g>
  <!-- Arms -->
  <rect x="3" y="74" width="22" height="10" rx="5" fill="#8b7040"/>
  <rect x="55" y="74" width="22" height="10" rx="5" fill="#8b7040"/>
  <!-- Glove hands -->
  <ellipse cx="5" cy="79" rx="6" ry="7" fill="#226622"/>
  <ellipse cx="75" cy="79" rx="6" ry="7" fill="#226622"/>
  <!-- Straw wrists -->
  <g stroke="#ddbb44" stroke-width="1.5" stroke-linecap="round">
    <line x1="3" y1="73" x2="1" y2="67"/><line x1="7" y1="72" x2="5" y2="66"/>
    <line x1="73" y1="73" x2="75" y2="67"/><line x1="77" y1="72" x2="79" y2="66"/>
  </g>
  <!-- Neck post -->
  <rect x="36" y="52" width="8" height="20" rx="3" fill="#8b7040"/>
  <!-- Straw at neck -->
  <g stroke="#ddbb44" stroke-width="1.5" stroke-linecap="round">
    <line x1="34" y1="55" x2="30" y2="49"/><line x1="40" y1="53" x2="40" y2="47"/>
    <line x1="46" y1="55" x2="50" y2="49"/>
  </g>
  <!-- Head (burlap sack) -->
  <ellipse cx="40" cy="38" rx="20" ry="22" fill="#d4aa66"/>
  <!-- Burlap texture -->
  <g stroke="#b08840" stroke-width="0.7" opacity="0.5">
    <line x1="30" y1="17" x2="29" y2="59"/><line x1="35" y1="16" x2="35" y2="60"/>
    <line x1="40" y1="16" x2="40" y2="60"/><line x1="45" y1="16" x2="46" y2="60"/>
    <line x1="50" y1="17" x2="51" y2="59"/>
  </g>
  <!-- Stitched eyes (X) -->
  <g stroke="#332200" stroke-width="2.5" stroke-linecap="round">
    <line x1="29" y1="34" x2="33" y2="38"/><line x1="33" y1="34" x2="29" y2="38"/>
    <line x1="47" y1="34" x2="51" y2="38"/><line x1="51" y1="34" x2="47" y2="38"/>
  </g>
  <!-- Stitched smile -->
  <path d="M30,47 L33,50 L37,47 L41,50 L45,47 L48,50" stroke="#332200" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Button nose -->
  <circle cx="40" cy="42" r="3" fill="#cc4422"/>
  <circle cx="40" cy="42" r="1.5" fill="#992200"/>
  <!-- Straw hat brim -->
  <ellipse cx="40" cy="18" rx="28" ry="6" fill="#cc9922"/>
  <!-- Hat top -->
  <rect x="28" y="2" width="24" height="18" rx="3" fill="#ddaa33"/>
  <ellipse cx="40" cy="2" rx="12" ry="4" fill="#cc9922"/>
  <!-- Hat straw decoration -->
  <g stroke="#eecc44" stroke-width="1" stroke-linecap="round" opacity="0.8">
    <line x1="14" y1="18" x2="10" y2="22"/><line x1="18" y1="20" x2="15" y2="24"/>
    <line x1="62" y1="18" x2="66" y2="22"/><line x1="66" y1="20" x2="69" y2="24"/>
    <line x1="68" y1="16" x2="73" y2="19"/><line x1="12" y1="16" x2="7" y2="19"/>
  </g>
  <!-- Hat flower -->
  <g fill="#ff6622">
    <circle cx="52" cy="10" r="4"/>
    <circle cx="52" cy="5" r="3"/><circle cx="57" cy="8" r="3"/><circle cx="57" cy="13" r="3"/>
    <circle cx="47" cy="13" r="3"/><circle cx="47" cy="8" r="3"/>
  </g>
  <circle cx="52" cy="10" r="2.5" fill="#ffdd00"/>
</svg>
