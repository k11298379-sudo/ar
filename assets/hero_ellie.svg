<svg xmlns="http://www.w3.org/2000/svg" width="80" height="160" viewBox="0 0 80 160">
  <!-- Shoes -->
  <ellipse cx="28" cy="155" rx="10" ry="5" fill="#cc2222"/>
  <ellipse cx="52" cy="155" rx="10" ry="5" fill="#cc2222"/>
  <!-- Legs -->
  <rect x="24" y="118" width="10" height="38" rx="4" fill="#f5c5a0"/>
  <rect x="46" y="118" width="10" height="38" rx="4" fill="#f5c5a0"/>
  <!-- Dress -->
  <polygon points="22,118 58,118 64,155 16,155" fill="#4488dd"/>
  <polygon points="22,118 58,118 68,160 12,160" fill="#3366cc"/>
  <!-- Apron -->
  <polygon points="28,100 52,100 56,130 24,130" fill="white" opacity="0.85"/>
  <!-- Bodice -->
  <rect x="26" y="75" width="28" height="48" rx="5" fill="#4488dd"/>
  <!-- Arms -->
  <line x1="26" y1="82" x2="10" y2="105" stroke="#f5c5a0" stroke-width="8" stroke-linecap="round"/>
  <line x1="54" y1="82" x2="70" y2="105" stroke="#f5c5a0" stroke-width="8" stroke-linecap="round"/>
  <circle cx="10" cy="108" r="5" fill="#f5c5a0"/>
  <circle cx="70" cy="108" r="5" fill="#f5c5a0"/>
  <!-- Neck -->
  <rect x="34" y="60" width="12" height="18" rx="4" fill="#f5c5a0"/>
  <!-- Head -->
  <ellipse cx="40" cy="48" rx="22" ry="24" fill="#f5c5a0"/>
  <!-- Eyes -->
  <circle cx="33" cy="45" r="3" fill="#443322"/>
  <circle cx="47" cy="45" r="3" fill="#443322"/>
  <circle cx="34" cy="44" r="1.2" fill="white"/>
  <circle cx="48" cy="44" r="1.2" fill="white"/>
  <!-- Cheeks -->
  <circle cx="28" cy="51" r="4" fill="#ff9999" opacity="0.5"/>
  <circle cx="52" cy="51" r="4" fill="#ff9999" opacity="0.5"/>
  <!-- Mouth -->
  <path d="M35,56 Q40,61 45,56" stroke="#cc7755" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Nose -->
  <ellipse cx="40" cy="51" rx="2" ry="1.5" fill="#e8a080"/>
  <!-- Pigtails -->
  <rect x="3" y="28" width="14" height="30" rx="7" fill="#774422" transform="rotate(-15 10 43)"/>
  <rect x="63" y="28" width="14" height="30" rx="7" fill="#774422" transform="rotate(15 70 43)"/>
  <!-- Hair -->
  <ellipse cx="40" cy="30" rx="22" ry="16" fill="#774422"/>
  <!-- Bows -->
  <g fill="#ff4466">
    <path d="M5,32 L14,38 L5,44 Z"/>
    <path d="M18,32 L9,38 L18,44 Z"/>
    <circle cx="11" cy="38" r="3"/>
    <path d="M62,32 L71,38 L62,44 Z"/>
    <path d="M75,32 L66,38 L75,44 Z"/>
    <circle cx="69" cy="38" r="3"/>
  </g>
</svg>
