<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350">
  <defs>
    <linearGradient id="brickGrad" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%"   stop-color="#e6b800"/>
      <stop offset="100%" stop-color="#ffd53d"/>
    </linearGradient>
    <linearGradient id="brickEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#997300"/>
      <stop offset="10%" stop-color="#ffe066"/>
      <stop offset="90%" stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#997300"/>
    </linearGradient>
    <linearGradient id="grassSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="rgba(20,50,20,0.3)"/>
      <stop offset="100%" stop-color="rgba(10,35,10,0.85)"/>
    </linearGradient>
    <filter id="roadGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Side grass blends (semi-transparent for AR) -->
  <polygon points="0,60 330,60 0,350" fill="url(#grassSide)"/>
  <polygon points="800,60 470,60 800,350" fill="url(#grassSide)"/>

  <!-- Yellow Brick Road Perspective -->
  <polygon points="330,60 470,60 800,350 0,350" fill="url(#brickGrad)"/>

  <!-- Glowing Road Edge Borders -->
  <line x1="330" y1="60" x2="0"   y2="350" stroke="#ffeb3b" stroke-width="4" filter="url(#roadGlow)"/>
  <line x1="470" y1="60" x2="800" y2="350" stroke="#ffeb3b" stroke-width="4" filter="url(#roadGlow)"/>

  <!-- Brick Grid Perspective Lines -->
  <g stroke="#b38600" stroke-width="1.8" fill="none" opacity="0.75">
    <!-- Horizontal rows (getting wider as they approach camera) -->
    <line x1="318" y1="75"  x2="482" y2="75"/>
    <line x1="298" y1="95"  x2="502" y2="95"/>
    <line x1="270" y1="120" x2="530" y2="120"/>
    <line x1="230" y1="155" x2="570" y2="155"/>
    <line x1="180" y1="195" x2="620" y2="195"/>
    <line x1="120" y1="245" x2="680" y2="245"/>
    <line x1="50"  y1="300" x2="750" y2="300"/>

    <!-- Vertical converging perspective lines -->
    <line x1="400" y1="60" x2="400" y2="350"/>
    <line x1="400" y1="60" x2="250" y2="350"/>
    <line x1="400" y1="60" x2="100" y2="350"/>
    <line x1="400" y1="60" x2="550" y2="350"/>
    <line x1="400" y1="60" x2="700" y2="350"/>
  </g>

  <!-- Sparkling gold dust on road -->
  <g fill="#ffffff" opacity="0.75">
    <circle cx="390" cy="90" r="1.5"/><circle cx="420" cy="110" r="2"/>
    <circle cx="340" cy="170" r="2.5"/><circle cx="480" cy="180" r="2"/>
    <circle cx="280" cy="230" r="3"/><circle cx="530" cy="220" r="3"/>
    <circle cx="200" cy="280" r="3.5"/><circle cx="610" cy="290" r="3.5"/>
  </g>
</svg>
